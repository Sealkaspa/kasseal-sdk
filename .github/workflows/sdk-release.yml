name: sdk-release

# @kassealhq/sdk (packages/kasseal-sdk):
#   checks   every push and pull request, and on dispatch: typecheck and the release checks (build, pack, package
#            checks, leak scans of the tarball and the repository, byte parity with the builder from source, tests).
#            No secrets.
#   publish  only on a pushed tag `sdk-v<version>` matching the package version: the same checks, then
#            `npm stage publish --access public` through npm trusted publishing (OIDC, the `npm` environment; no
#            stored token, provenance added by npm). A staged version goes live only when a maintainer approves it
#            with 2FA on npmjs.com (or `npm stage approve`); CI can stage, never publish directly.
# Every action is pinned by commit SHA.

on:
  push:
    branches: ['**']
    tags: ['sdk-v*']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.0'
  PNPM_VERSION: '9.15.9'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm --filter @kassealhq/sdk typecheck
      - name: Release checks
        run: pnpm --filter @kassealhq/sdk run release:check

  publish:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: The tag names the package version
        working-directory: packages/kasseal-sdk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "sdk-v$version" ]; then
            echo "tag $TAG does not match package version $version" >&2
            exit 1
          fi
      - name: Release checks (builds dist/)
        run: pnpm --filter @kassealhq/sdk run release:check
      # Trusted publishing needs npm 11.5.1 or later and `npm stage publish` a later 11.x; Node 22.23 ships npm 10.
      - name: npm 11 for trusted publishing
        run: npm install -g npm@11
      - name: Stage the release (approve it on npmjs.com with 2FA)
        working-directory: packages/kasseal-sdk
        run: npm stage publish --access public
